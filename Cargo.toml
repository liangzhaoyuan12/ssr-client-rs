[package]
name = "ssr-client-rs"
version = "0.1.0"
edition = "2021"
# MSRV floor: std::iter::repeat_n (1.82) is the newest std API used.
rust-version = "1.82"
description = "Byte-compatible ShadowsocksR (SSR-N) client library: crypto, protocol, obfs and async TCP/UDP relay, ported from ssr-n"
license = "GPL-3.0-or-later"
repository = "https://cnb.cool/liangzhaoyuan12/ssr-client-rs"
readme = "README.md"
keywords = ["shadowsocksr", "ssr", "proxy", "socks5", "cryptography"]
categories = ["network-programming", "cryptography"]

[dependencies]
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "time", "sync", "signal"] }
aes = "0.9"
cipher = "0.5"
rc4 = "0.2"
chacha20 = { version = "0.10", features = ["legacy"] }
salsa20 = "0.11"
blowfish = "0.10"
des = "0.9"
cfb-mode = "0.9"
ctr = "0.10"
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
digest = "0.10"
base64 = "0.22"
crc32fast = "1"
rand = "0.8"
thiserror = "2"
log = "0.4"

[dev-dependencies]
hex = "0.4"
proptest = "1"
criterion = "0.5"

[[bench]]
name = "cipher_throughput"
harness = false

[[bench]]
name = "protocol_overhead"
harness = false

[[bench]]
name = "obfs_overhead"
harness = false

# Q2: freeze the zero-warning baseline — any new rustc warning fails the build.
[lints.rust]
warnings = "deny"

# Q6: release hardening. panic = "abort" is deliberately NOT set — this is a
# library crate; downstream decides.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
